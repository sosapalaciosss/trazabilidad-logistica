<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trazabilidad Logistica</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
    .card { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; max-width: 460px; }
    h1 { margin: 0 0 8px; }
    .ok { color: #4ade80; font-weight: bold; }
    .info { color: #94a3b8; margin-top: 16px; line-height: 1.6; }
    code { background: #334155; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚚 Trazabilidad Logistica</h1>
    <p class="ok" id="estado">Conectando con el servidor...</p>
    <p class="info">
      Los cimientos estan listos. Elige una vista para continuar.
    </p>
    <div style="margin-top: 20px;">
      <a href="/conductor.html" style="display:inline-block; margin:6px; padding:14px 22px; background:#16a34a;
         color:white; border-radius:12px; text-decoration:none; font-weight:600;">
        🚛 Vista del Conductor
      </a>
      <a href="/cliente.html" style="display:inline-block; margin:6px; padding:14px 22px; background:#1d4ed8;
         color:white; border-radius:12px; text-decoration:none; font-weight:600;">
        📦 Seguimiento (Cliente)
      </a>
      <a href="/panel.html" style="display:inline-block; margin:6px; padding:14px 22px; background:#7c3aed;
         color:white; border-radius:12px; text-decoration:none; font-weight:600;">
        📊 Panel del Dueno
      </a>
    </div>
  </div>
  <script>
    fetch('/api/salud')
      .then(r => r.json())
      .then(d => {
        document.getElementById('estado').textContent =
          '✅ ' + d.mensaje + ' — ' + d.viajes + ' viajes en la base de datos';
      })
      .catch(() => {
        document.getElementById('estado').textContent = '❌ No se pudo conectar';
      });
  </script>
</body>
</html>
